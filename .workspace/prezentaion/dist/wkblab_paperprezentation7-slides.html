<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="%E5%90%8C%E6%9C%9F-rl-%E3%81%AF%E3%81%A9%E3%81%93%E3%81%A7%E5%BE%85%E3%81%A4%E3%81%AE%E3%81%8B">同期 RL はどこで待つのか</h3>
<pre><code class="language-text">env を進める
  -&gt; policy で推論する
    -&gt; learner が更新する
      -&gt; 次の env を進める
</code></pre>
<ul>
<li>この順番だと CPU と GPU が交互に待ちやすい</li>
<li>全体の速度は最も遅い段階に引っ張られる</li>
<li>論文の出発点はこの待ち時間を減らすこと</li>
</ul>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-class="column-layout" data-theme="tmu-cs" lang="C" class="column-layout" data-marpit-pagination="6" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--class:column-layout;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>

<h3 id="%E9%9D%9E%E5%90%8C%E6%9C%9F%E5%8C%96%E3%81%99%E3%82%8B%E3%81%A8%E9%80%9F%E3%81%8F%E3%81%AA%E3%82%8B%E3%81%8C%E9%9B%A3%E3%81%97%E3%81%95%E3%82%82%E5%A2%97%E3%81%88%E3%82%8B">非同期化すると速くなるが難しさも増える</h3>
<div class="column">
<h4 id="%E3%81%86%E3%82%8C%E3%81%97%E3%81%84%E3%81%93%E3%81%A8">うれしいこと</h4>
<ul>
<li>env 実行と GPU 推論を重ねられる</li>
<li>learner 更新も並行しやすい</li>
<li>throughput を大きく上げやすい</li>
</ul>
</div>
<div class="column">
<h4 id="%E9%9B%A3%E3%81%97%E3%81%84%E3%81%93%E3%81%A8">難しいこと</h4>
<ul>
<li>worker 間通信が増える</li>
<li>古い policy のデータが混ざる</li>
<li>学習が不安定になることがある</li>
</ul>
</div>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="policy-lag"><code>policy lag</code></h3>
<blockquote>
<h4 id="%E7%9B%B4%E6%84%9F">直感</h4>
<p>データを集めたときの policy と、<br />
learner が今更新している policy がずれること。</p>
</blockquote>
<ul>
<li>非同期化するとこのズレが大きくなりやすい</li>
<li>ズレが大きすぎると update が不安定になる</li>
<li>後半では、このズレをどう抑えるかを実装と式の両方から見る</li>
</ul>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="sample-factory-%E3%81%AE%E6%A0%B8%E3%81%AF%E5%AE%9F%E8%A1%8C%E7%B3%BB%E3%81%AE%E5%88%86%E6%A5%AD%E3%81%AB%E3%81%82%E3%82%8B">Sample Factory の核は実行系の分業にある</h3>
<blockquote>
<h4 id="%E4%BD%95%E3%82%92%E3%81%97%E3%81%9F%E8%AB%96%E6%96%87%E3%81%8B">何をした論文か</h4>
<p>Sample Factory は、<br />
<strong>CPU の環境実行・GPU 推論・GPU 学習を同時並行で回す</strong> ために、<br />
RL システムを部品分割した実行系である。 <span class="citation-ref">[1]</span></p>
</blockquote>
<ul>
<li>ただ速いだけでは不十分</li>
<li>async 化で増える policy lag も抑えないと学習が崩れる</li>
<li>実装はこの 2 つを両立させる設計になっている</li>
</ul>
<div class="citation-footnotes-marker"></div>
<ul>
<li><span class="citation-footnote-label">[1]</span> A. Petrenko, Z. Huang, T. Kumar, G. S. Sukhatme, and V. Koltun, “Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning,” in <i>Proceedings of the 37th International Conference on Machine Learning</i>, 2020, vol. 119, pp. 7652–7662, [Online]. Available: <a href="https://proceedings.mlr.press/v119/petrenko20a.html">https://proceedings.mlr.press/v119/petrenko20a.html</a>. <span class="citation-links">[<a href="https://proceedings.mlr.press/v119/petrenko20a.html">URL</a>]</span></li>
</ul>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-class="column-layout" data-theme="tmu-cs" lang="C" class="column-layout" data-marpit-pagination="9" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--class:column-layout;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>

<h3 id="%E6%97%A2%E5%AD%98%E6%B3%95%E3%81%A7%E4%BD%95%E3%81%8C%E8%A9%B0%E3%81%BE%E3%82%8B%E3%81%8B">既存法で何が詰まるか</h3>
<div class="column">
<h4 id="%E5%90%8C%E6%9C%9F-ppo--a2c">同期 PPO / A2C</h4>
<ul>
<li>env step 中しか CPU が働かない</li>
<li>forward/backward 中は env が止まる</li>
<li>高い GPU 利用率を作りにくい</li>
</ul>
</div>
<div class="column">
<h4 id="%E5%8D%98%E7%B4%94%E3%81%AA-async-%E5%8C%96">単純な async 化</h4>
<ul>
<li>worker 間通信が重い</li>
<li>古い policy で集めた軌跡が増える</li>
<li>sample efficiency が落ちやすい</li>
</ul>
</div>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="背景">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="%E3%81%93%E3%81%AE%E8%AB%96%E6%96%87%E3%81%8C%E8%A7%A3%E3%81%8F-4-%E3%81%A4%E3%81%AE%E5%95%8F%E9%A1%8C">この論文が解く 4 つの問題</h3>
<table>
<thead>
<tr>
<th style="text-align:left">問題</th>
<th style="text-align:left">論文の方針</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">待ち時間</td>
<td style="text-align:left">workload を rollout / policy / learner に分割</td>
</tr>
<tr>
<td style="text-align:left">通信量</td>
<td style="text-align:left">tensor は shared memory、queue は index だけ</td>
</tr>
<tr>
<td style="text-align:left">policy lag</td>
<td style="text-align:left">重み即時反映 + 古い軌跡の制御</td>
</tr>
<tr>
<td style="text-align:left">off-policy 化</td>
<td style="text-align:left">PPO clipping と V-trace で補正</td>
</tr>
</tbody>
</table>
<p><small>論文: pp.2-5, Sec. 3.1-3.4</small></p>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-class="section-page auxiliary-page" class="section-page auxiliary-page" id="13" data-paginate="false" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="">

<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="algo-%E3%81%AB%E5%AE%9F%E8%A1%8C%E7%B3%BB%E3%81%AE%E4%B8%AD%E6%A0%B8%E3%81%8C%E9%9B%86%E3%81%BE%E3%81%A3%E3%81%A6%E3%81%84%E3%82%8B"><code>algo/</code> に実行系の中核が集まっている</h3>
<pre><code class="language-text">sample_factory/algo/

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="sampling-%E3%81%AF-env-%E5%AE%9F%E8%A1%8C%E3%81%A8%E6%8E%A8%E8%AB%96%E3%82%92%E5%88%86%E6%A5%AD%E3%81%97%E3%81%A6%E3%81%84%E3%82%8B"><code>sampling/</code> は env 実行と推論を分業している</h3>
<pre><code class="language-text">sample_factory/algo/sampling/
├── sampler.py

├── non_batched_sampling.py
│   per-actor runner for flexible environment layouts
└── sampling_utils.py / stats.py

</code></pre>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="learning-%E3%81%A8-algoutils-%E3%81%8C%E6%9B%B4%E6%96%B0%E5%87%A6%E7%90%86%E3%82%92%E6%94%AF%E3%81%88%E3%82%8B"><code>learning/</code> と <code>algo/utils/</code> が更新処理を支える</h3>

sample_factory/algo/utils/

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="%E5%AD%A6%E7%BF%92%E9%96%8B%E5%A7%8B%E3%81%8B%E3%82%89-learner-%E6%9B%B4%E6%96%B0%E3%81%BE%E3%81%A7%E3%81%AE%E6%9C%AC%E7%B7%9A">学習開始から learner 更新までの本線</h3>
<pre><code class="language-text">[cfg/arguments.py + cfg/cfg.py]
              |
              v
          [train.py]
              |
              v
 [algo/runners/runner_parallel.py]

         v                 v

         \                 /

           v             v
 [algo/utils/shared_buffers.py]
 [algo/utils/model_sharing.py]

[model/] and [envs/] are called from sampling/learning
</code></pre>
<footer>鈴木史麿 / 05-01</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">
<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="appo---asynchronous-ppo">APPO - asynchronous PPO</h3>
<blockquote>
<h4 id="%E5%AE%9A%E7%BE%A9">定義</h4>
<p>PPO の clipped update を土台にしつつ、<br />
サンプリングと learner 更新を非同期に重ねる方式。</p>
</blockquote>
<ul>
<li>learner が更新している間も rollout worker は sample を集め続ける</li>
<li>そのため sample は「少し古い policy」によるものを含む</li>
<li>Sample Factory はこの前提で throughput を上げる <span class="citation-ref">[1]</span></li>
</ul>
<p><small>論文: p.1, Introduction 後半; pp.4-5, Sec. 3.4</small></p>
<div class="citation-footnotes-marker"></div>
<ul>

</ul>

<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="appo-%E3%82%92%E6%88%90%E7%AB%8B%E3%81%95%E3%81%9B%E3%82%8B-3-%E3%81%A4%E3%81%AE%E8%A6%81%E7%B4%A0">APPO を成立させる 3 つの要素</h3>
<table>
<thead>
<tr>
<th style="text-align:left">要素</th>
<th style="text-align:left">役割</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">async sampling</td>
<td style="text-align:left">CPU の env 実行と learner 更新を止めない</td>
</tr>
<tr>
<td style="text-align:left">PPO clipping</td>
<td style="text-align:left">policy update を急に動かしすぎない</td>
</tr>
<tr>
<td style="text-align:left">V-trace / lag control</td>
<td style="text-align:left">古い policy 由来の sample のズレを抑える</td>
</tr>
</tbody>
</table>
<p>この後の <code>shared memory</code>、<code>policy_version</code>、V-trace はこの表の具体化として読む。</p>

<header data-section-name="設計">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="%E5%AE%9F%E8%A1%8C%E6%99%82%E3%83%87%E3%83%BC%E3%82%BF%E3%83%95%E3%83%AD%E3%83%BC">実行時データフロー</h3>
<pre><code class="language-text">RolloutWorker
  -&gt; policy request を queue へ送る
InferenceWorker
  -&gt; request を batch 化して GPU forward
  -&gt; action / logprob / value を shared buffer に書く
RolloutWorker
  -&gt; env.step() して rollout を完成させる
Batcher / Learner
  -&gt; 学習バッチ化し、重みと policy_version を更新する
</code></pre>
<ul>
<li>重要なのは「大きな tensor を送らない」こと</li>
<li>重要なのは「推論と学習の更新をなるべく止めない」こと</li>
</ul>
<p><small>論文: p.3, Figure 1 caption; Sec. 3.1 の rollout/policy/learner 説明</small></p>

<header data-section-name="問題と解決">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="1-%E5%BE%85%E3%81%A1%E6%99%82%E9%96%93-env-%E3%81%A8%E6%8E%A8%E8%AB%96%E3%81%8C%E4%BA%A4%E4%BA%92%E3%81%AB%E6%AD%A2%E3%81%BE%E3%82%8B">1. 待ち時間: env と推論が交互に止まる</h3>
<ul>
<li>論文の解決策は double-buffered sampling</li>
<li>1 worker が持つ env 群を split し、片方の推論待ち中にもう片方を進める</li>
<li>現行実装では <code>worker_num_splits</code> がそのまま対応する</li>
</ul>
<p>対応箇所:</p>
<ul>
<li><code>RolloutWorker.num_splits</code></li>
<li><code>RolloutWorker.env_runners</code></li>
<li><code>BatchedVectorEnvRunner</code> / <code>NonBatchedVectorEnvRunner</code></li>
</ul>
<p><small>論文: p.4, Figure 2(b) と Sec. 3.2 冒頭</small></p>
<footer>鈴木史麿 / 05-01</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">

<h3 id="2-%E9%80%9A%E4%BF%A1%E9%87%8F-actor-%E3%81%A8-learner-%E9%96%93%E3%81%A7%E5%B7%A8%E5%A4%A7-tensor-%E3%82%92%E9%80%81%E3%82%8A%E3%81%9F%E3%81%8F%E3%81%AA%E3%81%84">2. 通信量: actor と learner 間で巨大 tensor を送りたくない</h3>
<ul>
<li>論文は「queue では metadata だけ送る」と整理する</li>
<li>実データは shared tensor 上に置き、受け手は index から参照する</li>
<li>これで serialization cost を大きく減らす</li>

<footer>鈴木史麿 / 05-01</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning" data-footer="鈴木史麿 / 05-01" data-theme="tmu-cs" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning;--footer:鈴木史麿 / 05-01;--theme:tmu-cs;" data-marpit-pagination-total="29">

<h3 id="3-policy-lag-async-%E5%8C%96%E3%81%99%E3%82%8B%E3%81%A8%E5%8F%A4%E3%81%84-policy-%E3%81%AE%E8%BB%8C%E8%B7%A1%E3%81%8C%E6%B7%B7%E3%81%96%E3%82%8B">3. policy lag: async 化すると古い policy の軌跡が混ざる</h3>
<ul>
<li>論文では lag の原因を 2 つに分ける</li>
<li>1つ目: 推論側が古い重みを持つ</li>
<li>2つ目: learner が処理し切れない軌跡が溜まる</li>
</ul>
<p>現行実装の対策:</p>
<ul>
<li><code>ensure_weights_updated()</code> で推論側へ即時反映</li>
<li><code>policy_version</code> を軌跡ごとに保存</li>
<li><code>max_policy_lag</code> を超えたデータは learner 側で無効化</li>
</ul>
<p><small>論文: pp.4-5, Sec. 3.4 前半</small></p>

<header data-section-name="問題と解決">論文紹介 / Sample Factory: Egocentric 3D Control from Pixels at 100000 FPS with Asynchronous Reinforcement Learning</header>
<h3 id="4-off-policy-%E3%81%AE%E3%82%BA%E3%83%AC%E3%81%AF-learner-%E5%81%B4%E3%81%A7%E5%90%B8%E5%8F%8E%E3%81%99%E3%82%8B">4. off-policy のズレは learner 側で吸収する</h3>
<script>(function mathAnnotationRuntime() {
  if (window.__tmuCsMathAnnotationRuntimeLoaded) return;
  window.__tmuCsMathAnnotationRuntimeLoaded = true;

  const TAB10_COLORS = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];
  const HIGHLIGHT_ALPHA = 0.20;
  const BOX_BG_ALPHA = 0.08;
  const BOX_BORDER_ALPHA = 0.45;
  const BAND_MARGIN = 16;
  const HORIZONTAL_GAP = 10;

  function isDebugEnabled() {
    if (window.__TMU_CS_MATH_DEBUG === true) return true;

    try {
      if (window.localStorage?.getItem('tmu-cs-math-debug') === '1') return true;
    } catch (_error) {
      // Ignore storage access failures.
    }

    try {
      const params = new URLSearchParams(window.location.search || '');
      const value = params.get('mathDebug');
      return value === '1' || value === 'true' || value === 'yes';
    } catch (_error) {
      return false;
    }
  }

  function round(value) {
    return Math.round(Number(value || 0) * 1000) / 1000;
  }

  function formatLogValue(value) {
    if (value === null || value === undefined) return String(value);
    if (typeof value === 'number') return String(round(value));
    if (typeof value === 'string') return value;

    try {
      return JSON.stringify(value);
    } catch (_error) {
      return String(value);
    }
  }

  function appendDebugLine(debugEl, args) {
    if (!debugEl) return;
    const line = Array.prototype.map.call(args, formatLogValue).join(' ');
    debugEl.textContent += line + '\n';
  }

  function emitConsoleLog(args) {
    if (typeof console !== 'undefined' && typeof console.log === 'function') {
      console.log.apply(console, ['[tmu-cs math]'].concat(Array.prototype.slice.call(args)));
    }
  }

  function createLogger(debugEl) {
    return function () {
      emitConsoleLog(arguments);
      appendDebugLine(debugEl, arguments);
    };
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function normalizeHexColor(value) {
    const raw = String(value || '').trim();
    if (!raw) return TAB10_COLORS[0];
    const withHash = raw.charAt(0) === '#' ? raw : '#' + raw;
    if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(withHash)) return withHash;
    return TAB10_COLORS[0];
  }

  function hexToRgb(hex) {
    const normalized = normalizeHexColor(hex).replace('#', '');
    const full = normalized.length === 3
      ? normalized.split('').map(function (character) { return character + character; }).join('')
      : normalized;
    const intVal = parseInt(full, 16);
    return {
      r: (intVal >> 16) & 255,
      g: (intVal >> 8) & 255,
      b: intVal & 255,
    };
  }

  function buildTheme(color) {
    const normalizedColor = normalizeHexColor(color);
    const rgb = hexToRgb(normalizedColor);

    return {
      color: normalizedColor,
      fill: 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + HIGHLIGHT_ALPHA + ')',
      stroke: 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')',
      softStroke: 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + BOX_BORDER_ALPHA + ')',
      boxBg: 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + BOX_BG_ALPHA + ')',
    };
  }

  function simplifyViewportRect(rect) {
    return {
      left: round(rect.left),
      top: round(rect.top),
      width: round(rect.width),
      height: round(rect.height),
    };
  }

  function simplifyLocalRect(rect) {
    return {
      x: round(rect.x),
      y: round(rect.y),
      w: round(rect.w),
      h: round(rect.h),
    };
  }

  function getStageMetrics(stage, overlay) {
    const stageRect = stage.getBoundingClientRect();
    const overlayRect = overlay.getBoundingClientRect();
    const localWidth = Math.max(stage.clientWidth || stage.offsetWidth || 0, 1);
    const localHeight = Math.max(stage.clientHeight || stage.offsetHeight || 0, 1);
    const scaleX = overlayRect.width > 0 ? overlayRect.width / localWidth : 1;
    const scaleY = overlayRect.height > 0 ? overlayRect.height / localHeight : 1;

    return {
      stageRect,
      overlayRect,
      localWidth,
      localHeight,
      scaleX: scaleX || 1,
      scaleY: scaleY || 1,
    };
  }

  function describeMetrics(metrics) {
    return {
      stageRect: simplifyViewportRect(metrics.stageRect),
      overlayRect: simplifyViewportRect(metrics.overlayRect),
      localWidth: round(metrics.localWidth),
      localHeight: round(metrics.localHeight),
      scaleX: round(metrics.scaleX),
      scaleY: round(metrics.scaleY),
    };
  }

  function rectToStageCoords(rect, metrics) {
    return {
      x: (rect.left - metrics.overlayRect.left) / metrics.scaleX,
      y: (rect.top - metrics.overlayRect.top) / metrics.scaleY,
      w: rect.width / metrics.scaleX,
      h: rect.height / metrics.scaleY,
    };
  }

  function makeSvgEl(name) {
    return document.createElementNS('http://www.w3.org/2000/svg', name);
  }

  function clearWarning(warningEl) {
    if (!warningEl) return;
    warningEl.hidden = true;
    warningEl.textContent = '';
  }

  function clearDebug(debugEl, enabled) {
    if (!debugEl) return;
    debugEl.hidden = !enabled;
    debugEl.textContent = '';
  }

  function setWarning(warningEl, log, message) {
    log('warning', message);
    if (!warningEl) return;
    warningEl.hidden = false;
    warningEl.textContent = message;
  }

  function clearStage(stage, overlays, warningEl, debugEl, debugEnabled) {
    overlays.forEach(function (overlay) {
      if (overlay) overlay.innerHTML = '';
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.eqann-box'), function (box) {
      box.remove();
    });
    clearWarning(warningEl);
    clearDebug(debugEl, debugEnabled);
  }

  function updateOverlaySize(overlay, metrics) {
    if (!overlay) return;
    overlay.setAttribute('width', String(metrics.localWidth));
    overlay.setAttribute('height', String(metrics.localHeight));
    overlay.setAttribute('viewBox', '0 0 ' + metrics.localWidth + ' ' + metrics.localHeight);
  }

  function setBoxContent(box, note, noteHtml) {
    box.replaceChildren();

    if (typeof noteHtml === 'string' && noteHtml !== '') {
      const template = document.createElement('template');
      template.innerHTML = noteHtml;
      box.appendChild(template.content.cloneNode(true));
      return;
    }

    if (note) {
      box.textContent = note;
    }
  }

  function applyBoxTheme(box, theme) {
    box.style.borderColor = theme.softStroke;
    box.style.color = theme.stroke;
    box.style.background = theme.boxBg;
  }

  function measureBox(stage, note, noteHtml, theme, metrics) {
    const box = document.createElement('div');
    box.className = 'eqann-box';
    box.style.left = '-99999px';
    box.style.top = '-99999px';
    applyBoxTheme(box, theme);
    setBoxContent(box, note, noteHtml);
    stage.appendChild(box);
    const rect = rectToStageCoords(box.getBoundingClientRect(), metrics);
    box.remove();

    return {
      w: rect.w,
      h: rect.h,
    };
  }

  function clipSegmentToRectBoundary(rect, fromPoint, toPoint) {
    const cx = fromPoint.x;
    const cy = fromPoint.y;
    const dx = toPoint.x - cx;
    const dy = toPoint.y - cy;
    const candidates = [];
    const eps = 1e-9;

    if (Math.abs(dx) > eps) {
      [rect.x, rect.x + rect.w].forEach(function (xEdge) {
        const t = (xEdge - cx) / dx;
        if (t > 0 && t <= 1) {
          const y = cy + t * dy;
          if (y >= rect.y - eps && y <= rect.y + rect.h + eps) {
            candidates.push({ t: t, x: xEdge, y: y });
          }
        }
      });
    }

    if (Math.abs(dy) > eps) {
      [rect.y, rect.y + rect.h].forEach(function (yEdge) {
        const t = (yEdge - cy) / dy;
        if (t > 0 && t <= 1) {
          const x = cx + t * dx;
          if (x >= rect.x - eps && x <= rect.x + rect.w + eps) {
            candidates.push({ t: t, x: x, y: yEdge });
          }
        }
      });
    }

    if (!candidates.length) {
      return { x: cx, y: cy };
    }

    candidates.sort(function (left, right) { return left.t - right.t; });
    return { x: candidates[0].x, y: candidates[0].y };
  }

  function computeMathBounds(stage, math, metrics) {
    const mathRect = math.getBoundingClientRect();
    const mjx = math.querySelector('mjx-container');
    const targetRect = mjx ? mjx.getBoundingClientRect() : mathRect;

    return rectToStageCoords(targetRect, metrics);
  }

  function intersects(candidate, existing) {
    return (
      candidate.x < existing.x + existing.w + HORIZONTAL_GAP
      && candidate.x + candidate.w + HORIZONTAL_GAP > existing.x
    );
  }

  function chooseBandPlacement(targetRect, size, side, placedSide, mathRect, stageWidth) {
    const targetCenterX = targetRect.x + targetRect.w / 2;
    const maxX = Math.max(0, stageWidth - size.w);
    let x = clamp(targetCenterX - size.w / 2, 0, maxX);
    const sorted = placedSide.slice().sort(function (left, right) { return left.x - right.x; });
    let moved = true;

    while (moved) {
      moved = false;

      for (let index = 0; index < sorted.length; index += 1) {
        const existing = sorted[index];
        const candidate = { x: x, y: 0, w: size.w, h: size.h };

        if (!intersects(candidate, existing)) continue;

        const shifted = existing.x + existing.w + HORIZONTAL_GAP;
        const nextX = clamp(shifted, 0, maxX);

        if (Math.abs(nextX - x) < 0.5) continue;

        x = nextX;
        moved = true;
      }
    }

    return {
      x: x,
      y: side === 'top'
        ? Math.max(0, mathRect.y - BAND_MARGIN - size.h)
        : mathRect.y + mathRect.h + BAND_MARGIN,
      w: size.w,
      h: size.h,
      side: side,
    };
  }

  function parseAnnotations(stage) {
    const dataEl = stage.querySelector('.eqann-data');
    if (!dataEl) return [];

    try {
      const parsed = JSON.parse(dataEl.textContent || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      emitConsoleLog(['annotations:parse error', String(error)]);
      return [];
    }
  }

  async function renderStage(stage) {
    const math = stage.querySelector('.eqann-math');
    const backOverlay = stage.querySelector('.eqann-overlay-back');
    const frontOverlay = stage.querySelector('.eqann-overlay-front');
    const warningEl = stage.parentElement ? stage.parentElement.querySelector('.eqann-warning') : null;
    const debugEnabled = isDebugEnabled();
    const debugEl = stage.parentElement ? stage.parentElement.querySelector('.eqann-debug') : null;
    const log = createLogger(debugEnabled ? debugEl : null);

    if (!math || !backOverlay || !frontOverlay) return;
    if (stage.clientWidth <= 0 || stage.clientHeight <= 0) return;

    clearStage(stage, [backOverlay, frontOverlay], warningEl, debugEl, debugEnabled);

    const annotations = parseAnnotations(stage);
    if (!annotations.length) return;

    log('preprocess:start');
    log('preprocess:annotations', annotations);

    const measurementMetrics = getStageMetrics(stage, frontOverlay);
    log('stage:metrics:measure', describeMetrics(measurementMetrics));

    const measured = await Promise.all(annotations.map(async function (annotation, index) {
      const theme = buildTheme(annotation.color || TAB10_COLORS[index % TAB10_COLORS.length]);
      return {
        ann: annotation,
        theme: theme,
        side: index % 2 === 0 ? 'top' : 'bottom',
        size: measureBox(stage, annotation.note || '', annotation.noteHtml || '', theme, measurementMetrics),
      };
    }));

    const topBandHeight = measured
      .filter(function (item) { return item.side === 'top'; })
      .reduce(function (maxHeight, item) { return Math.max(maxHeight, item.size.h); }, 0);
    const bottomBandHeight = measured
      .filter(function (item) { return item.side === 'bottom'; })
      .reduce(function (maxHeight, item) { return Math.max(maxHeight, item.size.h); }, 0);

    stage.style.setProperty('--eqann-top-band', Math.max(0, topBandHeight + BAND_MARGIN) + 'px');
    stage.style.setProperty('--eqann-bottom-band', Math.max(0, bottomBandHeight + BAND_MARGIN) + 'px');

    log('mathjax:before typeset');
    const metrics = getStageMetrics(stage, frontOverlay);
    const stageWidth = metrics.localWidth;
    updateOverlaySize(backOverlay, metrics);
    updateOverlaySize(frontOverlay, metrics);
    log('mathjax:after typeset');
    log('stage:metrics', describeMetrics(metrics));

    const mathRect = computeMathBounds(stage, math, metrics);
    log('overlay:math rect', simplifyLocalRect(mathRect));

    if (!mathRect || mathRect.w <= 0 || mathRect.h <= 0) return;

    const totalWidth = measured.reduce(function (sum, item) { return sum + item.size.w; }, 0);
    if (totalWidth > 1.5 * mathRect.w) {
      setWarning(warningEl, log, 'warning: 全 note の幅の総和が数式全体の幅の 1.5 倍を超えています。配置が混み合う可能性があります。');
    }

    const placedTop = [];
    const placedBottom = [];

    for (const item of measured) {
      const targetEl = math.querySelector('.eqann-' + item.ann.id);
      if (!targetEl) {
        log('overlay:target missing', item.ann);
        continue;
      }

      const targetViewportRect = targetEl.getBoundingClientRect();
      const targetRect = rectToStageCoords(targetViewportRect, metrics);
      log('overlay:target rect', {
        id: item.ann.id,
        raw: simplifyViewportRect(targetViewportRect),
        rect: simplifyLocalRect(targetRect),
      });

      const placedSide = item.side === 'top' ? placedTop : placedBottom;
      const pos = chooseBandPlacement(targetRect, item.size, item.side, placedSide, mathRect, stageWidth);
      placedSide.push(pos);

      const highlight = makeSvgEl('rect');
      highlight.setAttribute('x', String(targetRect.x));
      highlight.setAttribute('y', String(targetRect.y));
      highlight.setAttribute('width', String(targetRect.w));
      highlight.setAttribute('height', String(targetRect.h));
      highlight.setAttribute('fill', item.theme.fill);
      highlight.setAttribute('stroke', 'none');
      highlight.setAttribute('rx', '0');
      highlight.setAttribute('ry', '0');
      backOverlay.appendChild(highlight);

      const box = document.createElement('div');
      box.className = 'eqann-box';
      box.style.left = pos.x + 'px';
      box.style.top = pos.y + 'px';
      applyBoxTheme(box, item.theme);
      setBoxContent(box, item.ann.note || '', item.ann.noteHtml || '');
      stage.appendChild(box);

      const boxViewportRect = box.getBoundingClientRect();
      const boxRect = rectToStageCoords(boxViewportRect, metrics);
      pos.x = boxRect.x;
      pos.y = boxRect.y;
      pos.w = boxRect.w;
      pos.h = boxRect.h;
      log('overlay:box rect', {
        id: item.ann.id,
        raw: simplifyViewportRect(boxViewportRect),
        rect: simplifyLocalRect(boxRect),
      });

      const targetCenter = {
        x: targetRect.x + targetRect.w / 2,
        y: targetRect.y + targetRect.h / 2,
      };
      const boxCenter = {
        x: pos.x + pos.w / 2,
        y: pos.y + pos.h / 2,
      };
      const clippedStart = clipSegmentToRectBoundary(targetRect, targetCenter, boxCenter);
      const clippedEnd = clipSegmentToRectBoundary(pos, boxCenter, targetCenter);

      const line = makeSvgEl('line');
      line.setAttribute('x1', String(clippedStart.x));
      line.setAttribute('y1', String(clippedStart.y));
      line.setAttribute('x2', String(clippedEnd.x));
      line.setAttribute('y2', String(clippedEnd.y));
      line.setAttribute('stroke', item.theme.stroke);
      line.setAttribute('stroke-opacity', '0.9');
      line.setAttribute('stroke-width', '1.4');
      frontOverlay.appendChild(line);
    }
  }

  let resizeObserver = null;
  let scheduled = false;
  let initialized = false;

  async function renderAll() {
    scheduled = false;
    await Promise.all(Array.prototype.map.call(document.querySelectorAll('.eqann-stage'), function (stage) {
      return renderStage(stage);
    }));
  }

  function scheduleRenderAll() {
    if (scheduled) return;
    scheduled = true;
    window.requestAnimationFrame(function () {
      void renderAll();
    });
  }

  function init() {
    if (initialized) {
      scheduleRenderAll();
      return;
    }

    initialized = true;

    if (typeof ResizeObserver === 'function') {
      resizeObserver = new ResizeObserver(function () {
        scheduleRenderAll();
      });

      Array.prototype.forEach.call(document.querySelectorAll('.eqann-stage'), function (stage) {
        resizeObserver.observe(stage);
      });
    }

    window.addEventListener('resize', scheduleRenderAll);
    window.setTimeout(scheduleRenderAll, 0);
    window.setTimeout(scheduleRenderAll, 100);
